spring:
  application:
    name: pas-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/pas_db
    username: pas_user
    password: pas_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLXRoaXMtdG8tYS1zZWN1cmUtc2VjcmV0LWtleS1pbi1wcm9kdWN0aW9u}
    expiration-ms: 86400000
    issuer: pas-backend
  upload:
    directory: uploads/
    max-size: 10MB
  mock:
    enabled: true

logging:
  level:
    com.pas.backend: DEBUG
    org.hibernate.SQL: WARN
