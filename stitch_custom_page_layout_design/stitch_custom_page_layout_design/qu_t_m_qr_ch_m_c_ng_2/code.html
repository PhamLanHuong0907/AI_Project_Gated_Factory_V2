<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .camera-overlay {
            background: rgba(19, 27, 46, 0.7);
        }
        .scan-area {
            box-shadow: 0 0 0 4000px rgba(19, 27, 46, 0.7);
        }
        .corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #004ac6;
            border-style: solid;
        }
        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: #004ac6;
            position: absolute;
            top: 0;
            box-shadow: 0 0 8px #004ac6;
            animation: scan 2s linear infinite;
        }
        
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-base antialiased h-screen w-screen overflow-hidden relative">
<!-- Camera Viewfinder Background -->
<div class="absolute inset-0 z-0 bg-inverse-surface">
<div class="bg-cover bg-center w-full h-full opacity-50 blur-sm" data-alt="A blurred background resembling a corporate office environment viewed through a mobile phone camera lens. The scene is slightly out of focus, featuring modern office lighting, glass partitions, and indoor plants. The lighting is bright and cool, reflecting a professional daytime setting. High-tech, clean aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDpriOccebVJ7snSuy22sjzQBQVs1HbYbnx37sFd5Pz_269_EXq2W7AcGiFldhamQUlAZan3mVtXHY7e5YF-ndGhknzZy1TXe5KRg8ws_s0e6xTa87VuchXnN2LAEcuhqGXm4W1TKcmtMLijhbMT5EDpB55a1TnYNOo5tjC04Vlrjp6RF6g_EfCBD5mfVnLZ9Mia-sN1GGdvCvXQBmEsYT0CDlreJEYTyHboDj2lmW8dJn5O-roYh78Fg')"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 h-full w-full flex flex-col pt-safe pb-24">
<!-- Top Info Header -->
<header class="w-full p-md flex flex-col gap-sm">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<h1 class="font-headline-xl text-headline-xl text-on-primary">Chấm công ca làm</h1>
<p class="font-body-sm text-body-sm text-inverse-on-surface opacity-80">Ca sáng (08:00 - 12:00)</p>
</div>
<button aria-label="Đổi camera" class="w-11 h-11 rounded-full bg-surface-container-highest/30 backdrop-blur-md flex items-center justify-center text-on-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="cameraswitch">cameraswitch</span>
</button>
</div>
<!-- GPS Status Pill -->
<div class="self-start inline-flex items-center gap-2 bg-success-light/90 backdrop-blur-sm px-3 py-1.5 rounded-full border border-success/20 shadow-sm mt-2">
<span class="material-symbols-outlined text-success text-[18px]" data-icon="my_location" data-weight="fill">my_location</span>
<span class="font-body-sm text-body-sm text-success font-semibold">Đã xác thực vị trí (12m)</span>
</div>
</header>
<!-- QR Scan Area -->
<div class="flex-1 flex flex-col items-center justify-center relative w-full px-8">
<div class="relative w-64 h-64 mx-auto rounded-xl overflow-hidden scan-area">
<!-- Transparent center hole is created by scan-area box-shadow -->
<div class="absolute inset-0 z-20">
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>
<div class="scan-line"></div>
</div>
</div>
<p class="mt-8 font-body-base text-body-base text-on-primary text-center px-4 max-w-sm drop-shadow-md">
                Di chuyển camera đến gần mã QR để quét tự động
            </p>
</div>
<!-- Action Buttons -->
<div class="w-full px-md pb-md flex justify-center gap-4">
<button class="flex items-center justify-center gap-2 h-11 px-6 rounded-lg bg-surface/20 backdrop-blur-md border border-outline-variant/30 text-on-primary font-body-sm text-body-sm font-semibold hover:bg-surface/30 active:scale-95 transition-all w-full max-w-xs shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                Quét lại
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Shared Component) -->
<nav class="bg-surface dark:bg-inverse-surface border-t border-border dark:border-outline-variant shadow-lg fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe h-16 rounded-t-xl md:hidden">
<!-- Active Tab: Chấm công -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-6 py-1 tap-highlight-transparent active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="qr_code_scanner" data-weight="fill">qr_code_scanner</span>
<span class="font-label-xs text-label-xs mt-1">Chấm công</span>
</button>
<!-- Inactive Tab: Lịch sử -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant active:bg-surface-container-high tap-highlight-transparent active:scale-95 transition-transform px-2 py-1 rounded-lg">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-xs text-label-xs mt-1">Lịch sử</span>
</button>
<!-- Inactive Tab: Đơn từ -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant active:bg-surface-container-high tap-highlight-transparent active:scale-95 transition-transform px-2 py-1 rounded-lg">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-label-xs text-label-xs mt-1">Đơn từ</span>
</button>
<!-- Inactive Tab: Cá nhân -->
<button class="flex flex-col items-center justify-center text-on-secondary-fixed-variant active:bg-surface-container-high tap-highlight-transparent active:scale-95 transition-transform px-2 py-1 rounded-lg">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-xs text-label-xs mt-1">Cá nhân</span>
</button>
</nav>
<!-- Script for interaction simulation -->
<script>
        document.querySelectorAll('.material-symbols-outlined[data-weight="fill"]').forEach(icon => {
            icon.style.fontVariationSettings = "'FILL' 1";
        });
    </script>
</body></html>
